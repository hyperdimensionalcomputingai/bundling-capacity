[project]
name = "scale-experiment"
version = "0.1.0"
description = "Majority-bundled categorical records at scale: cosine by shared-property count, and the highest zero-overlap score, across D and N"
requires-python = ">=3.13,<3.14"
dependencies = [
  "matplotlib==3.11.1",
  "plotnine>=0.15.8",
  "polars==1.44.1",
  "pyarrow==25.0.1",
  "scipy==1.18.1",
  "torch==2.13.0",
  "torch-hd==5.8.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
