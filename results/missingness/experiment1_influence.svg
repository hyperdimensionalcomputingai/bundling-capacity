    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="474.137146" y="238.652667" transform="rotate(-0 474.137146 238.652667)">one of four properties</text>
   </g>
   <g id="text_27">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="453.69332" y="70.208" transform="rotate(-0 453.69332 70.208)">With normalization</text>
   </g>
  </g>
  <g id="text_28">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="37.182711" y="19.3575" transform="rotate(-0 37.182711 19.3575)">Without normalization, listing more interests makes interests count for more</text>
  </g>
  <g id="text_29">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="37.182711" y="37.642359" transform="rotate(-0 37.182711 37.642359)">Share of a same-person match supplied by the interests property; age, job and region known on both sides</text>
  </g>
  <g id="text_30">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="37.182711" y="366.624" transform="rotate(-0 37.182711 366.624)">D = 2,048 · lines: exact value with orthogonal atoms · markers: mean over 20 seeds × 500 records · both sides list their first interests, so the shorter list is shared</text>
  </g>
